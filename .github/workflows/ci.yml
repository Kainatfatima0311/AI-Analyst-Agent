name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  POSTGRES_DB: analyst
  POSTGRES_USER: app_rw
  POSTGRES_PASSWORD: ci_app_rw_pw
  ANALYST_RO_USER: analyst_ro
  ANALYST_RO_PASSWORD: ci_analyst_ro_pw

jobs:
  # Fast feedback, and no database: lint, types, and the security regression net. The guard suite
  # runs with a committed catalogue snapshot precisely so it can run here with nothing to set up.
  static:
    name: Lint, types, and the SQL guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy

      # A required gate, and named as one. If a hostile query ever gets through, nothing else
      # about this build matters.
      - name: SQL guard hostile-query suite
        run: pytest tests/unit/test_sql_guard.py -v

      - name: Unit tests
        run: pytest tests/unit -v

      - name: The metrics catalogue is not stale
        run: python scripts/generate_metrics_catalog.py --check

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_rw -d analyst"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_RW_DSN: postgresql://app_rw:ci_app_rw_pw@localhost:5432/analyst
      DB_RO_DSN: postgresql://analyst_ro:ci_analyst_ro_pw@localhost:5432/analyst

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client

      # The service container does not run our init scripts, so the roles, schema and grants are
      # applied here. This is also, usefully, a test that those scripts work outside Docker.
      - name: Create roles, schema and grants
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          for file in 01_roles 02_schema 03_grants; do
            psql -h localhost -U app_rw -d analyst -v ON_ERROR_STOP=1 --no-psqlrc \
              --set db_name=analyst \
              --set app_user=app_rw \
              --set ro_user=analyst_ro \
              --set ro_password=ci_analyst_ro_pw \
              --set statement_timeout=15000 \
              --set idle_tx_timeout=30000 \
              -f "db/init/sql/${file}.sql"
          done

      - name: Migrate
        run: python scripts/migrate.py

      # Synthetic, deliberately: CI must not depend on Kaggle credentials or on a network
      # download, and the generator is deterministic so a failure here is a real failure.
      - name: Seed
        run: python scripts/seed_db.py --source synthetic

      # Control C1 asserted before anything else runs. If the read-only role can write, every
      # other result in this build is meaningless.
      - name: The read-only role is read-only
        run: python scripts/smoke.py

      - name: The committed catalogue matches the database
        run: pytest tests/integration/test_sql_guard_live.py -v

      - name: Integration tests
        run: pytest tests/integration -v

      # Needs no API key: it executes every reference query and puts each through the guard, so a
      # question that has rotted is caught even though the agent cannot be scored here.
      - name: The evaluation suite is sound
        run: python -m evals.runner --validate

      - name: Coverage
        run: pytest --cov=src/analyst_agent --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: The stack builds and starts
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4

      - name: Write a .env for compose
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${{ env.POSTGRES_PASSWORD }}|" .env
          sed -i "s|^ANALYST_RO_PASSWORD=.*|ANALYST_RO_PASSWORD=${{ env.ANALYST_RO_PASSWORD }}|" .env

      - name: Build
        run: docker compose build

      # The acceptance test for Step 13: a clean clone plus `docker compose up` gives a working
      # stack. Started detached, then the API's own readiness probe is what is checked — which
      # also means the seed job completed, because the API waits on it.
      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 300 api

      - name: The API is ready and the read-only role verified
        run: |
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/readyz
          curl -fsS http://localhost:8000/v1/metrics | head -c 400

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Down
        if: always()
        run: docker compose down -v
