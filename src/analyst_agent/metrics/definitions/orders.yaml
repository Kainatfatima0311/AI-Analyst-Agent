name: orders
version: 1
title: Order count
description: >
  Number of distinct orders that were not cancelled. Counted at order grain, so an order with
  five items counts once.
owner: analytics-team
grain: order
unit: count
aliases: [order volume, number of orders, order count, purchases]
measure: "count(DISTINCT o.order_id)"
from_sql: |
  analytics.orders o
  JOIN analytics.order_items oi ON oi.order_id = o.order_id
where_sql: "o.order_status <> 'canceled'"
date_column: "o.order_purchase_timestamp"
dimensions:
  month:
    sql: "to_char(o.order_purchase_timestamp, 'YYYY-MM')"
    label: Month
  order_status:
    sql: "o.order_status"
    label: Order status
  customer_state:
    sql: "c.customer_state"
    label: Customer state
    join: "JOIN analytics.customers c ON c.customer_id = o.customer_id"
  product_category:
    sql: "p.product_category_name"
    label: Product category
    join: "JOIN analytics.products p ON p.product_id = oi.product_id"
caveats:
  - COUNT(DISTINCT order_id) is required because the base grain is the item line.
  - Broken down by product category, an order spanning two categories counts in both.
