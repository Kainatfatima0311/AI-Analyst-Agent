[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyst-agent"
version = "0.1.0"
description = "AI Data Analyst and Business Intelligence Agent — safe SQL, multi-hypothesis investigation, traceable conclusions"
readme = "README.md"
requires-python = ">=3.12"   # numpy 2.5 type stubs use 3.12+ syntax; 3.11 is untested
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # LLM + orchestration
    "anthropic>=1.0",
    "groq>=1.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    # Database
    "psycopg[binary,pool]>=3.2",
    "sqlalchemy>=2.0",
    # SQL safety
    "sqlglot>=30.0",
    # Analysis + charts
    "pandas>=2.2,<4",
    "numpy>=2.0,<3",
    "plotly>=6.0",
    "kaleido>=1.0",
    # UI
    "streamlit>=1.40",
    "requests>=2.32",
    # Config / logging
    "pyyaml>=6.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",          # starlette TestClient
    "ruff>=0.8",
    "mypy>=2.0",
    "types-pyyaml",
    "types-requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
analyst_agent = ["metrics/definitions/*.yaml", "agent/prompts/*.md"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S"]
ignore = [
    "E501",   # line length handled by the formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]   # asserts, dummy credentials, fabricated SQL strings
"evals/**" = ["S101"]
"db/seed/**" = ["S608", "S310", "S311"]      # COPY builder, authenticated download, seeded RNG

[tool.mypy]
python_version = "3.12"
packages = ["analyst_agent"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: requires a running Postgres (docker compose up -d db)",
    "llm: requires ANTHROPIC_API_KEY and makes real model calls",
]

[tool.coverage.run]
source = ["src/analyst_agent"]
branch = true
